# Link check configuration for the Docs workflow.
accept = ["200..=299", "429"]
max_retries = 3
timeout = 20
exclude = [
  # Requires sign-in.
  "^https://github\\.com/settings/",
  "^https://support\\.github\\.com/",
  # Templates and new-issue links redirect to sign-in for anonymous requests.
  "/issues/new",
  # The workflow badge 404s until the workflow exists on main.
  "^https://github\\.com/NiraphatK/achievements-playground/actions/",
]
